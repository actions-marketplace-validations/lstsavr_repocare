name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node dist/src/cli.js scan . --fail-under 95
        if: matrix.node-version == 24
      - run: npm pack --dry-run
        if: matrix.node-version == 24

  action-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the local composite action
        id: repocare
        uses: ./
        with:
          output: artifacts/repocare-report.md
          fail-under: 95
      - name: Verify the action output
        shell: bash
        run: test -s "${{ steps.repocare.outputs.report }}"
