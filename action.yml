name: "RepoCare repository health"
description: "Scan open-source repository health and generate an actionable report."
author: "RepoCare contributors"
branding:
  icon: "heart"
  color: "green"
inputs:
  path:
    description: "Repository path to scan"
    required: false
    default: "."
  output:
    description: "Report path"
    required: false
    default: "repocare-report.md"
  format:
    description: "Report format: text, markdown, json, or sarif"
    required: false
    default: "markdown"
  fail-under:
    description: "Optional score threshold; overrides the config file"
    required: false
    default: ""
  job-summary:
    description: "Add Markdown reports to the GitHub Actions job summary"
    required: false
    default: "true"
  config:
    description: "Optional RepoCare config file path"
    required: false
    default: ""
outputs:
  report:
    description: "Path to the generated report"
    value: ${{ steps.scan.outputs.report }}
runs:
  using: "composite"
  steps:
    - name: Run RepoCare
      id: scan
      shell: bash
      env:
        REPOCARE_PATH: ${{ inputs.path }}
        REPOCARE_OUTPUT: ${{ inputs.output }}
        REPOCARE_FORMAT: ${{ inputs.format }}
        REPOCARE_FAIL_UNDER: ${{ inputs.fail-under }}
        REPOCARE_JOB_SUMMARY: ${{ inputs.job-summary }}
        REPOCARE_CONFIG: ${{ inputs.config }}
      run: |
        set +e
        args=(scan "$REPOCARE_PATH" --format "$REPOCARE_FORMAT" --output "$REPOCARE_OUTPUT")
        if [[ -n "$REPOCARE_FAIL_UNDER" ]]; then
          args+=(--fail-under "$REPOCARE_FAIL_UNDER")
        fi
        if [[ -n "$REPOCARE_CONFIG" ]]; then
          args+=(--config "$REPOCARE_CONFIG")
        fi
        node "$GITHUB_ACTION_PATH/dist/src/cli.js" "${args[@]}"
        status=$?
        set -e

        printf 'report=%s\n' "$REPOCARE_OUTPUT" >> "$GITHUB_OUTPUT"
        if [[ "$REPOCARE_JOB_SUMMARY" == "true" && "$REPOCARE_FORMAT" == "markdown" && -f "$REPOCARE_OUTPUT" ]]; then
          cat "$REPOCARE_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$status"
